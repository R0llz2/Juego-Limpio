:root{
/* Inicio sobre una cancha con líneas de tiza; dentro del juego, tarjetas blancas sobre fondo claro y un solo acento fuerte: el amarillo del marcador */
--cancha:#1d7a4e;--cancha-2:#218656;--cancha-osc:#135437;
--tinta:#15233c;--tinta-2:#4a5873;--fondo:#f1f5f0;--tarjeta:#ffffff;--linea:#d4ded5;
--acento:#ffb703;--acento-suave:#fff3cf;
--ok:#16704a;--ok-fondo:#e0f2e7;--riesgo:#9c4706;--riesgo-fondo:#ffefd6;
--info:#22579a;--info-fondo:#e7eff9;
--display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
--texto:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--radio:14px;
color-scheme:light;
}
*{box-sizing:border-box}
html{font-size:17px;height:100%}
html.proyector{font-size:21px}
body{margin:0;height:100%;background:var(--fondo);color:var(--tinta);font-family:var(--texto);line-height:1.5;-webkit-font-smoothing:antialiased}
#raiz{min-height:100%;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
.ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.22em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{width:100%;max-width:900px;margin:0 auto;padding:0 16px 56px}
html.proyector .app{max-width:1200px}
.barra{display:flex;align-items:center;gap:12px;padding:14px 0;position:sticky;top:0;background:var(--fondo);z-index:5}
.barra h2{font-size:1.4rem;flex:1;min-width:0}
.btn-icono{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--linea);background:var(--tarjeta);display:grid;place-items:center;flex:none}
.btn-icono:hover{border-color:var(--tinta-2)}
.interruptor{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--linea);background:var(--tarjeta);font-size:.85rem;font-weight:700;flex:none}
.interruptor[aria-pressed="true"]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 24px;border-radius:var(--radio);border:2px solid var(--tinta);background:var(--tarjeta);font-weight:700;font-size:1rem;transition:transform .12s,box-shadow .12s;text-decoration:none}
.btn:hover{transform:translateY(-1px)}
.btn-principal{background:var(--acento);color:var(--tinta);box-shadow:0 4px 0 var(--tinta)}
.btn-principal:active{box-shadow:0 1px 0 var(--tinta);transform:translateY(3px)}
.btn-cancha{background:var(--cancha);color:#fff;border-color:var(--cancha-osc);box-shadow:0 4px 0 var(--cancha-osc)}
.btn-cancha:active{box-shadow:0 1px 0 var(--cancha-osc);transform:translateY(3px)}
.btn-chico{min-height:42px;padding:0 14px;font-size:.88rem;border-width:1.5px}

/* Inicio */
.campo{position:relative;flex:1;min-height:560px;background:repeating-linear-gradient(90deg,var(--cancha) 0 72px,var(--cancha-2) 72px 144px);color:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:56px 20px;text-align:center}

/* Avatar */
.avatar-grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
.avatar-vista{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;position:sticky;top:84px}

.opcion h3{font-size:1.05rem;margin-bottom:10px}
.muestras{display:flex;flex-wrap:wrap;gap:10px}
.muestra{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--linea)}

.pildora{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--linea);background:var(--tarjeta);font-weight:700;font-size:.9rem}

.numero{display:flex;align-items:center;gap:10px}

.campo-texto{width:100%;max-width:320px;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--linea);background:var(--tarjeta)}

/* Vestuario */

/* Mochila */
.derechos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.derecho{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--tarjeta);border:1.5px solid var(--linea)}

.derecho span{font-size:.88rem;color:var(--tinta-2)}
.caso-ficha{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--tarjeta);border:1.5px solid var(--linea);border-radius:20px;padding:16px 18px}

/* Nivel 1 */
.pasos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

.caso{position:relative;overflow:hidden;background:var(--tarjeta);border:2px solid var(--tinta);border-radius:22px;padding:24px 24px 26px;box-shadow:0 6px 0 var(--tinta)}

.lugar-casa{background:#fde9e4;color:#8a2d14}

.pregunta{font-weight:700;font-size:1.05rem;display:flex;gap:8px;align-items:center}

.estados{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.estado{display:flex;align-items:center;justify-content:center;gap:12px;min-height:82px;border-radius:18px;font-family:var(--display);font-size:1.5rem;border:2.5px solid currentColor;transition:transform .12s}

.votos{display:flex;flex-direction:column;gap:8px}
.acuerdo-item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border:1.5px solid var(--linea);border-radius:14px;background:var(--fondo)}
.acuerdo-item p{font-weight:700}
.si-no{display:flex;gap:6px;flex:none}
.check-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:12px;border:1.5px solid var(--linea);background:var(--tarjeta);font-weight:700;font-size:.88rem;text-align:left}
.check-btn[aria-pressed="true"]{background:var(--ok-fondo);border-color:var(--ok);color:var(--ok)}
.check-btn.no[aria-pressed="true"]{background:#fde2dc;border-color:#d9583b;color:#a3261b}
.cartel{background:var(--tarjeta);border:3px solid var(--tinta);border-radius:24px;overflow:hidden;box-shadow:0 8px 0 var(--tinta)}
.cartel-cabeza{background:repeating-linear-gradient(90deg,var(--cancha) 0 56px,var(--cancha-2) 56px 112px);color:#fff;padding:26px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.cartel-cabeza h2{font-size:clamp(2rem,6vw,3.2rem);text-shadow:0 4px 0 var(--cancha-osc)}
.cartel ol{counter-reset:acuerdo;list-style:none;padding:24px 26px 10px;margin:0;display:flex;flex-direction:column;gap:14px}
.cartel li{display:flex;gap:14px;align-items:flex-start;font-size:1.22rem;font-weight:700;line-height:1.35}
.cartel li::before{counter-increment:acuerdo;content:counter(acuerdo);font-family:var(--display);font-weight:400;background:var(--acento);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.cartel-reparar{display:flex;gap:12px;align-items:flex-start;margin:10px 26px 20px;padding:14px 16px;border-radius:14px;background:var(--info-fondo);color:#16365f}
.firma{border-top:2px dashed var(--linea);padding:16px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.firma .mini{width:64px;height:64px;border-radius:50%;background:var(--ok-fondo);border:3px solid var(--cancha);overflow:hidden;display:grid;place-items:center}
.firma .mini svg{width:58px;height:58px;margin-top:8px}
.album-completo{display:flex;gap:14px;align-items:center;background:var(--acento);color:var(--tinta);border:2px solid var(--tinta);border-radius:18px;padding:16px 18px;box-shadow:0 4px 0 var(--tinta)}
.album-completo .ic{width:34px;height:34px}

/* Mejoras: voz, guía, herramientas, registro */
.btn-escuchar{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;min-height:34px;padding:0 10px;border-radius:999px;border:1.5px solid var(--linea);background:var(--tarjeta);color:var(--info);font-weight:700;font-size:.85rem}
.btn-escuchar:hover{border-color:var(--info)}
.btn-escuchar.grande{min-height:42px;padding:0 14px;font-size:.92rem}
.btn-escuchar.claro{background:transparent;color:#fff;border-color:rgba(255,255,255,.6);margin:12px 0 0 30px}
.caras6{grid-template-columns:repeat(3,minmax(0,1fr))}
.mv3{grid-template-columns:repeat(3,minmax(0,1fr))}
.mv3 .estado{font-size:1.08rem;min-height:96px;padding:10px 12px;text-align:center;flex-direction:column;gap:6px}
.estado.ambas{background:var(--info-fondo);color:var(--info)}
.pestanas{display:flex;flex-wrap:wrap;gap:6px;padding:4px 2px 12px;margin-bottom:6px}
.pestanas button,.pestanas-mini button{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--linea);background:var(--tarjeta);font-weight:700;font-size:.88rem}
.pestanas button[aria-selected="true"],.pestanas-mini button[aria-selected="true"]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.pestanas-mini{display:flex;gap:6px;flex-wrap:wrap}
.guia-panel{background:var(--tarjeta);border:2px solid var(--info);border-radius:18px;padding:16px 18px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.lista-guia{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.respuesta-guia{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--acento-suave);border-radius:12px;padding:12px 14px}
.respuesta-guia p{flex:1 1 100%}
.reloj{display:flex;flex-direction:column;gap:12px}
.reloj-num{font-family:var(--display);font-size:clamp(3rem,10vw,4.6rem);text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.reloj-num.fin{color:#c2362f}
.reloj-pista{height:14px;border-radius:7px;background:var(--fondo);border:1.5px solid var(--linea);overflow:hidden}
.reloj-barra{display:block;height:100%;background:var(--cancha);transition:width .2s linear}
.sorteo{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.sorteo-n{font-family:var(--display);font-size:1.6rem;min-width:2ch;text-align:center}
.sorteo-res{font-family:var(--display);font-size:clamp(2.2rem,8vw,3.6rem);text-align:center;background:var(--acento);border:2px solid var(--tinta);border-radius:18px;padding:16px;box-shadow:0 4px 0 var(--tinta)}
.sorteo-nota{font-size:.85rem;color:var(--tinta-2);text-align:center}
.herramientas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.herramientas h3{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.registro-tabla{min-width:760px}
.registro-tabla td,.registro-tabla th{text-align:center;vertical-align:middle}
.registro-tabla td:first-child,.registro-tabla th:first-child{text-align:left;font-weight:700}
.celda{min-width:52px;min-height:38px;border-radius:10px;border:1.5px solid var(--linea);background:var(--tarjeta);font-weight:700}
.celda.v1{background:var(--riesgo-fondo);border-color:var(--riesgo);color:var(--riesgo)}
.celda.v2{background:var(--ok-fondo);border-color:var(--ok);color:var(--ok)}
.celda.v3{background:var(--acento);border-color:var(--tinta);color:var(--tinta)}
textarea.area{max-width:100%;height:auto;padding:12px;font:inherit;line-height:1.5}
.tabla-res td:nth-child(2),.tabla-res td:nth-child(3){white-space:nowrap}
.mini-barra{display:inline-block;width:90px;height:10px;border-radius:5px;background:var(--fondo);border:1px solid var(--linea);overflow:hidden;vertical-align:middle;margin-right:6px}
.mini-barra span{display:block;height:100%;background:var(--cancha)}
.mini-barra span.media{background:var(--acento)}
.mini-barra span.baja{background:#d9583b}
.suave{color:var(--tinta-2);font-size:.9rem}

/* Docente */
.docente h3{font-size:1.35rem;margin-bottom:10px}
.docente h4{font-size:1.1rem;margin:14px 0 6px}
.docente p,.docente li{font-size:.95rem}
.docente ul,.docente ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.tabla-envoltura{overflow-x:auto;border:1.5px solid var(--linea);border-radius:14px;background:var(--tarjeta)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.88rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--linea);vertical-align:top}
th{background:var(--fondo);font-weight:700}
tr:last-child td{border-bottom:none}
.clave{max-width:420px;margin:24px auto}
.error{color:#a3261b;font-size:.9rem;font-weight:700;min-height:1.4em}

@media (max-width:640px){
  .avatar-grid,.cierre{grid-template-columns:1fr}
  .avatar-vista{position:static}
  .caso .texto{font-size:1.2rem}
  .estado{font-size:1.25rem;min-height:72px}
  .afirmacion{font-size:1.25rem}
  .nivel{grid-template-columns:auto minmax(0,1fr)}
  .nivel>:last-child{grid-column:1/-1}
  .datos{grid-template-columns:1fr}
  .barra .interruptor .txt{display:none}
  .caras{grid-template-columns:repeat(2,minmax(0,1fr))}
  .arena{grid-template-columns:1fr 1fr;padding:14px;gap:12px}
  .mv3{grid-template-columns:1fr}
  .mv3 .estado{min-height:64px;flex-direction:row}
  .caras6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vs{display:none}
  .luces{grid-template-columns:repeat(2,minmax(0,1fr))}
  .acuerdo-item{flex-direction:column;align-items:flex-start}
  .cartel li{font-size:1.05rem}
  .retrato{width:84px;height:84px}
  .retrato svg{width:78px;height:78px;margin-top:12px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

    case 4: arriba = `<path d="M32 52 C33 35 46 28 60 28 C74 28 87 35 88 52 C80 44 70 41 60 41 C50 41 40 44 32 52 Z" fill="${pelo}" opacity=".55"/>`; break;
    case 5: arriba = `<path d="M30 50 C30 32 44 24 60 24 C76 24 90 32 90 50 Z" fill="${cam}"${borde}/><path d="M60 47 L104 50 C104 55 97 57 89 56 L60 52 Z" fill="${cam}"${borde}/><circle cx="60" cy="25" r="3" fill="#15233c" opacity=".3"/>`; break;
  }
  return `<svg viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

    ${animo === 'enojado' ? '<path d="M44 50 L54 54 M76 50 L66 54" stroke="#15233c" stroke-width="2.6" stroke-linecap="round"/>' : ''}
    ${arriba}
  </svg>`;
}

const acciones = {
  ir(v){ state.errorClave = ''; state.screen = (v === 'docente-clave' && state.docenteOk) ? 'docente' : v; },
  jugar(){ state.screen = state.avatarListo ? 'vestuario' : 'avatar'; },
  proyector(){ state.proyector = !state.proyector; guardar(); },
  avatar(v){ const [campo, i] = v.split(':'); state.avatar[campo] = Number(i); guardar(); },
  numero(v){ let x = state.avatar.numero + Number(v); if (x < 1) x = 99; if (x > 99) x = 1; state.avatar.numero = x; guardar(); },
  'avatar-listo'(){ state.avatarListo = true; guardar(); state.screen = 'vestuario'; },
  'empezar-n1'(){ state.n1 = nuevoN1(); state.screen = 'n1-escaner'; },
  estado(v){
    const n = state.n1, s = S[n.orden[n.i]];
    if (n.fase !== 'estado') return;
    if (v === s.estado) { n.okEstado = n.intentosEstado === 0; n.fase = 'derecho'; n.pista = ''; n.sacudir = ''; }
    else { n.intentosEstado++; n.pista = v === 'cuidado' ? PISTA_A_RIESGO : PISTA_A_CUIDADO; n.sacudir = 'estado'; }
  },
  accion1(v){
    const n = state.n1, s = S[n.orden[n.i]], k = Number(v);
    if (!s.acciones || n.fase !== 'feedback' || n.accionOk) return;
    if (!n.accVistas.includes(k)) n.accVistas.push(k);
    if (s.acciones[k].ok) { n.accionOk = true; if (n.accVistas.length === 1) n.accionesOk++; registrar('n1a:' + s.id, n.accVistas.length === 1); }
  },
  porque1(v){
    const n = state.n1, m = MITOS[n.mi];
    if (!n.respMito || n.porqueResp !== null) return;
    n.porqueResp = Number(v);
    if (m.porque[n.porqueResp].ok) n.porqueOk++;
  },
  derecho(v){
    const n = state.n1, s = S[n.orden[n.i]];
    if (n.fase !== 'derecho') return;
    if (v === s.derecho || s.tambien.includes(v)) {
      n.elegido = v; n.okDerecho = n.intentosDerecho === 0; n.fase = 'feedback'; n.pista = ''; n.sacudir = '';
      if (n.okEstado && n.okDerecho) n.aciertos++;
      n.ordenAcc = s.acciones ? mezclar(s.acciones.map((_, k) => k)) : null;
      registrar('n1:' + s.id, n.okEstado && n.okDerecho);
    } else {
      n.intentosDerecho++;
      if (!n.descartados.includes(v)) n.descartados.push(v);
      if (n.intentosDerecho >= 2) { n.elegido = s.derecho; n.okDerecho = false; n.revelado = true; n.fase = 'feedback'; n.pista = ''; n.sacudir = ''; n.ordenAcc = s.acciones ? mezclar(s.acciones.map((_, k) => k)) : null; registrar('n1:' + s.id, false); }
      else { n.pista = 'Ese derecho también es importante, pero aquí hay otro que está más en juego. Pista: ' + s.pista; n.sacudir = 'derecho'; }
    }
  },
  siguiente(){
    const n = state.n1;
    if (n.i >= n.orden.length - 1) { state.screen = 'n1-mitos'; return; }
    Object.assign(n, {i:n.i + 1, fase:'estado', intentosEstado:0, intentosDerecho:0, okEstado:false, okDerecho:false, elegido:null, revelado:false, descartados:[], pista:'', sacudir:'', accVistas:[], accionOk:false, ordenAcc:null});
  },
  mito(v){ const n = state.n1; if (n.respMito) return; n.respMito = v; n.porqueResp = null; n.ordenPorque = mezclar(MITOS[n.mi].porque.map((_, k) => k)); if (v === MITOS[n.mi].resp) n.mitosOk++; registrar('n1m:' + n.mi, v === MITOS[n.mi].resp); },
  'siguiente-mito'(){
    const n = state.n1;
    if (n.mi >= MITOS.length - 1) { state.progreso.n1 = true; guardar(); contarPartida('n1'); state.screen = 'n1-cierre'; return; }
    n.mi++; n.respMito = null; n.porqueResp = null;
  },
  autoeval(v){ state.n1.autoeval = v; }
};

function burbuja(x, y, texto, cola = 'izq'){
  const w = Math.round(texto.length * 8.6 + 30), h = 38, bx = x - w / 2, base = y + h / 2;
  const tx = cola === 'izq' ? bx + 26 : cola === 'der' ? bx + w - 26 : x;
  const punta = cola === 'izq' ? tx - 10 : cola === 'der' ? tx + 10 : tx;
  return `<g class="burbuja">
    <rect x="${bx}" y="${y - h / 2}" width="${w}" height="${h}" rx="19" fill="#fff" stroke="${TINTA}" stroke-width="2.2"/>
    <path d="M${tx - 9} ${base - 2} L${punta} ${base + 18} L${tx + 9} ${base - 2} Z" fill="#fff" stroke="${TINTA}" stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="${tx - 7.5}" y1="${base - 1.2}" x2="${tx + 7.5}" y2="${base - 1.2}" stroke="#fff" stroke-width="4"/>
    <text x="${x}" y="${y + 6}" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-weight="700" font-size="17" fill="${TINTA}">${texto}</text>
  </g>`;
}

function patioSVG(){
  const n = state.n2;
  const orden = ['b3','p1','b1','p4','b2','p2','p5','p3'];
  const escenas = orden.map(id => {
    const e = ESCENAS2[id], [cx, cy, cw, ch] = e.caja;
    const activo = n.activo === id;
    return `<g class="escena" data-accion="escena" data-valor="${id}" tabindex="0" role="button" aria-label="Revisar esta parte del patio">
      ${e.dibujo()}
      <rect class="zona${activo ? ' activa' : ''}" x="${cx}" y="${cy}" width="${cw}" height="${ch}" rx="16" fill="#fff" fill-opacity="0"/>
    </g>`;
  }).join('');
  const marcas = Object.entries(ESCENAS2).map(([id, e]) => {
    const [mx, my] = e.marca;
    if (n.encontrados.includes(id)) return `<g transform="translate(${mx} ${my})"><circle r="20" fill="#ffb703" stroke="${TINTA}" stroke-width="3"/><path d="M-8 0 l5 5 l10 -11" fill="none" stroke="${TINTA}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>`;
    if (n.buenos.includes(id)) return `<g transform="translate(${mx} ${my})"><circle r="20" fill="#1d7a4e" stroke="#fff" stroke-width="3"/><path d="M0 8 C-12 0 -10 -10 -4 -10 C-1 -10 0 -7 0 -6 C0 -7 1 -10 4 -10 C10 -10 12 0 0 8 Z" fill="#fff"/></g>`;
    if (n.pistaEscena === id) return `<circle class="anillo" cx="${e.caja[0] + e.caja[2] / 2}" cy="${e.caja[1] + e.caja[3] / 2}" r="${Math.max(e.caja[2], e.caja[3]) / 2}" fill="none" stroke="#ffb703" stroke-width="6"/>`;
    return '';
  }).join('');
  return `<svg class="patio" viewBox="0 0 1200 720" role="group" aria-label="Ilustración del patio del colegio durante el recreo">${fondoPatio()}${escenas}${marcas}</svg>`;
}

let temporizadorPista = null;
Object.assign(acciones, {
  'empezar-n2'(){ state.n2 = nuevoN2(); state.screen = 'n2-buscar'; },
  escena(id){
    const n = state.n2;
    if (n.activo && CASOS2[n.activo] && n.fase !== 'cierre') { n.pista = 'Termina primero el caso que tienes abierto.'; return; }
    n.pista = ''; n.pistaEscena = null;
    if (CASOS2[id]) {
      if (n.encontrados.includes(id)) { n.activo = null; n.pista = 'Esta situación ya la resolviste. Busca otra.'; return; }
      n.encontrados.push(id); n.activo = id; n.fase = 'sentir'; n.sentimiento = null; n.accionesVistas = []; n.aciertoAccion = false; n.ordenAcc = mezclar(CASOS2[id].acciones.map((_, k) => k));
    } else if (BUENOS2[id]) {
      if (!n.buenos.includes(id)) n.buenos.push(id);
      n.activo = id; n.fase = null;
    }
    state.desplazar = 'panel-caso';
  },
  sentir(v){
    const n = state.n2;
    if (n.fase !== 'sentir') return;
    if (v === 'feliz') { n.pista = `Mira su cara y lo que le están diciendo. ¿Alguien se sentiría feliz en esa situación?`; n.sacudir = 'sentir'; return; }
    n.pista = ''; n.sentimiento = v; n.fase = 'actuar';
  },
  actuar(v){
    const n = state.n2, c = CASOS2[n.activo], k = Number(v);
    if (!c || (n.fase !== 'actuar' && n.fase !== 'cierre')) return;
    if (!n.accionesVistas.includes(k)) n.accionesVistas.push(k);
    if (c.acciones[k].ok) { if (n.fase !== 'cierre') registrar('n2:' + n.activo, n.accionesVistas.length === 1); n.fase = 'cierre'; n.pista = ''; }
    else if (n.fase !== 'cierre') { n.pista = 'Esa opción no ayuda. Mira lo que pasaría y elige otra.'; }
  },
  'cerrar-caso'(){ const n = state.n2; n.activo = null; n.fase = null; n.pista = ''; state.desplazar = 'patio-marco'; },
  pista2(){
    const n = state.n2;
    const faltan = PROBLEMAS2.filter(id => !n.encontrados.includes(id));
    if (!faltan.length) { n.pista = 'Ya encontraste todas las situaciones.'; return; }
    n.pistaEscena = faltan[0]; n.pista = 'Mira donde brilla el círculo amarillo.';
    clearTimeout(temporizadorPista);
    temporizadorPista = setTimeout(() => { if (state.n2) { state.n2.pistaEscena = null; if (state.screen === 'n2-buscar') render(); } }, 3500);
  },
  'ir-frases'(){ state.screen = 'n2-frases'; },
  frase(v){ const n = state.n2; if (n.frResp) return; n.frResp = v; n.fr2 = null; n.ordenFr2 = mezclar(FRASES2[n.fi].paso2.ops.map((_, k) => k)); if (v === FRASES2[n.fi].r) n.frasesOk++; registrar('n2f:' + n.fi, v === FRASES2[n.fi].r); },
  frase2(v){ const n = state.n2; if (!n.frResp || (n.fr2 !== null && n.fr2 !== undefined)) return; n.fr2 = Number(v); if (FRASES2[n.fi].paso2.ops[n.fr2].ok) n.frases2Ok = (n.frases2Ok || 0) + 1; },
  'siguiente-frase'(){
    const n = state.n2;
    if (n.fi >= FRASES2.length - 1) { state.progreso.n2 = true; guardar(); contarPartida('n2'); state.screen = 'n2-cierre'; return; }
    n.fi++; n.frResp = null; n.fr2 = null;
  },
  autoeval2(v){ state.n2.autoeval = v; }
});

function barajar(lista){
  const a = lista.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function nuevoDuelo3(n){
  const d = DUELOS3[n.di];
  Object.assign(n, {tu:d.inicio[0], otro:d.inicio[1], prevTu:d.inicio[0], prevOtro:d.inicio[1], jugadas:[], mano:barajar(d.cartas.map(c => c.id)), resultado:null, mostrarMaestra:false});
}
function nuevoN3(){
  return {fase:'calentamiento', ci:0, cResp:null, cOk:0, di:0, ganados:0, primerIntento:0, intentos:0, totalJugadas:0, autoeval:null, laminaVista:false,
    tu:0, otro:0, prevTu:0, prevOtro:0, jugadas:[], mano:[], resultado:null, mostrarMaestra:false};
}
function carta3(d, id){ return id === 'perdon' ? PERDON3 : d.cartas.find(c => c.id === id); }
function animo3(v){ return v >= META3 ? 'feliz' : v >= 45 ? 'serio' : v >= 25 ? 'triste' : 'enojado'; }
function textoAnimo3(v){ return v >= META3 ? 'Bien' : v >= 45 ? 'Más o menos' : v >= 25 ? 'Mal' : 'Muy molesto'; }

function medidor3(nombre, v, prev){
  const zona = v >= META3 ? 'verde' : v >= 45 ? 'ambar' : 'rojo';
  return `<div class="medidor">
    <div class="medidor-fila"><span>${nombre}</span><b>${textoAnimo3(v)}</b></div>
    <div class="medidor-pista" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}" aria-label="Cómo se siente ${nombre}">
      <span class="meta" style="left:${META3}%"></span>
      <span class="medidor-barra ${zona}" style="width:${prev}%" data-anima="${v}"></span>
    </div>
  </div>`;
}

Object.assign(acciones, {
  'empezar-n3'(){ state.n3 = nuevoN3(); state.screen = 'n3-calentamiento'; },
  calentar(v){ const n = state.n3; if (n.cResp) return; n.cResp = v; if (v === CALENTAMIENTO3[n.ci].r) n.cOk++; registrar('n3c:' + n.ci, v === CALENTAMIENTO3[n.ci].r); },
  'siguiente-calentar'(){
    const n = state.n3;
    if (n.ci >= CALENTAMIENTO3.length - 1) { n.di = 0; n.intentos = 0; n.registrado = false; nuevoDuelo3(n); state.screen = 'n3-duelo'; return; }
    n.ci++; n.cResp = null;
  },
  'jugar-carta'(id){
    const n = state.n3, d = DUELOS3[n.di];
    if (n.resultado || !n.mano.includes(id)) return;
    const c = carta3(d, id);
    n.prevTu = n.tu; n.prevOtro = n.otro;
    n.tu = Math.max(0, Math.min(100, n.tu + c.dTu));
    n.otro = Math.max(0, Math.min(100, n.otro + c.dOtro));
    n.jugadas.push(id); n.totalJugadas++;
    n.mano = n.mano.filter(x => x !== id);
    if (c.tipo === 'mala' && !d.cartas.some(x => x.tipo === 'disculpa') && !n.mano.includes('perdon') && !n.jugadas.includes('perdon')) n.mano.push('perdon');
    if (n.tu >= META3 && n.otro >= META3) {
      n.resultado = 'gana'; n.ganados++;
      if (n.intentos === 0) n.primerIntento++;
      if (!n.registrado) { registrar('n3d:' + d.id, n.intentos === 0); n.registrado = true; }
    } else if (n.jugadas.length >= MAX_JUGADAS3) {
      n.resultado = 'agotado';
      if (!n.registrado) { registrar('n3d:' + d.id, false); n.registrado = true; }
    }
    state.desplazar = n.resultado ? 'resultado-duelo' : null;
  },
  'ver-maestra'(){ state.n3.mostrarMaestra = true; },
  'reintentar-duelo'(){ const n = state.n3; n.intentos++; nuevoDuelo3(n); },
  'siguiente-duelo'(){

Object.assign(acciones, {
  'empezar-n4'(){ state.n4 = nuevoN4(); state.screen = 'n4-impuesta'; },
  impuesta(v){ const n = state.n4; if (n.iResp) return; n.iResp = v; if (v === IMPUESTA4[n.ii].r) n.iOk++; registrar('n4i:' + n.ii, v === IMPUESTA4[n.ii].r); },
  'siguiente-impuesta'(){
    const n = state.n4;
    if (n.ii >= IMPUESTA4.length - 1) { state.screen = 'n4-ideas'; return; }
    n.ii++; n.iResp = null;
  },
  diagnosticar(v){
    const n = state.n4, r = REGLAS4[n.ri];
    if (n.diag) return;
    const bien = r.falla.length ? r.falla.includes(v) : v === 'lista';
    if (bien) {
      n.diag = v; n.pista4 = '';
      if (!n.diagMal.length) n.inspectorOk++;
      registrar('n4r:' + r.id, !n.diagMal.length);
      if (r.opciones) n.ordenMejora = mezclar(r.opciones.map((_, k) => k));
      if (!r.falla.length) n.aprobadas[r.id] = r.t;
    } else {
      if (!n.diagMal.includes(v)) n.diagMal.push(v);
      n.sacudir = 'diag';
      n.pista4 = v === 'lista' ? 'Revisa otra vez con el medidor: ¿es igual para todos, cuida los derechos, es clara y se puede cumplir?' : (r.falla.length ? 'Esa parte sí la cumple. Busca qué otra cosa le falta.' : 'Mírala bien: esta regla sí cumple ese criterio.');
      if (n.diagMal.length >= 2) {
        n.diag = r.falla[0] || 'lista'; n.pista4 = 'Esta es la respuesta. Lean juntos la explicación.';
        registrar('n4r:' + r.id, false);
        if (r.opciones) n.ordenMejora = mezclar(r.opciones.map((_, k) => k));
        if (!r.falla.length) n.aprobadas[r.id] = r.t;
      }
    }
  },
  mejorar(v){
    const n = state.n4, r = REGLAS4[n.ri], k = Number(v), o = r.opciones[k];
    if (n.aprobadas[r.id]) return;
    if (o.ok) { n.aprobadas[r.id] = o.t; n.pista4 = ''; }
    else if (!n.mejoraMal.includes(k)) n.mejoraMal.push(k);
  },
  'siguiente-regla'(){
    const n = state.n4;
    if (n.ri >= REGLAS4.length - 1) { state.screen = 'n4-pacto'; return; }
    Object.assign(n, {ri:n.ri + 1, diag:null, diagMal:[], mejoraMal:[], pista4:'', ordenMejora:null});

  'check-propio'(v){ const n = state.n4; n.checks[Number(v)] = !n.checks[Number(v)]; n.errorPropio = ''; },
  'agregar-propio'(){
    const n = state.n4, t = (n.borrador || '').trim();

    if (!n.checks.every(Boolean)) { n.errorPropio = 'Revísenlo con el medidor: marquen los 4 criterios cuando el acuerdo los cumpla.'; return; }
    n.propios.push({t}); n.borrador = ''; n.checks = [false, false, false, false]; n.errorPropio = '';
  },
  'quitar-propio'(v){ state.n4.propios.splice(Number(v), 1); },
  reparacion(v){ state.n4.reparacion = v; state.n4.errorPacto = ''; },

let vozClaude = null, turnoVoz = 0;
const enVisor = !!(window.claude && typeof window.claude.use === 'function');
try { if (enVisor) window.claude.use('tts').then(t => { if (t) { vozClaude = t; render(); } }).catch(() => {}); } catch (e) {}
function vozDisponible(){ return !!vozClaude || ('speechSynthesis' in window); }
function detenerVoz(){
  turnoVoz++;
  try { if (vozClaude) vozClaude.stop(); } catch (e) {}
  try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
}
function hablarNavegador(t){
  try {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'es-CO'; u.rate = 0.95;
    const voces = window.speechSynthesis.getVoices();
    const v = voces.find(x => /^es[-_](CO|MX|US|419)/i.test(x.lang)) || voces.find(x => /^es/i.test(x.lang));
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
function hablar(t){
  detenerVoz();
  const mio = ++turnoVoz;
  if (vozClaude) {
    vozClaude.speak(t).catch(err => {
      if (mio !== turnoVoz) return;
      if (err && err.code === 'not_granted') vozClaude = null;
      if (!err || err.code !== 'viewer_stopped') hablarNavegador(t);
    });
  } else hablarNavegador(t);
}
function escuchar(texto, grande, variante){
  if (!vozDisponible()) return '';
  return `<button type="button" class="btn-escuchar${grande ? ' grande' : ''}${variante === 'claro' ? ' claro' : ''}" data-accion="escuchar" data-valor="${esc(texto)}" aria-label="Escuchar en voz alta">${ic('volume-2')}${grande ? '<span>Escuchar</span>' : ''}</button>`;
}

function descargar(nombre, texto, listo){
  if (descargasClaude) {
    descargasClaude.save({filename:nombre, data:'﻿' + texto}).then(() => listo('ok')).catch(e => listo(e && e.code === 'declined' ? 'cancelado' : 'error'));

  }
  if (enVisor) { listo('error'); return; }
  try {
    const url = URL.createObjectURL(new Blob(['﻿' + texto], {type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a'); a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    listo('ok');
  } catch (e) { listo('error'); }
}

const reloj = {total:60, restante:60, corriendo:false};
let relojIntervalo = null, relojFin = 0, audio = null;
function relojPintar(){
  const seg = Math.ceil(reloj.restante), mm = Math.floor(seg / 60), ss = String(seg % 60).padStart(2, '0');
  document.querySelectorAll('.reloj-num').forEach(el => { el.textContent = `${mm}:${ss}`; el.classList.toggle('fin', reloj.restante <= 0); });
  document.querySelectorAll('.reloj-barra').forEach(el => { el.style.width = (reloj.total ? 100 * reloj.restante / reloj.total : 0) + '%'; });
}
function sonar(){
  try {
    if (!audio) return;
    [0, 0.35, 0.7].forEach(t => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001, audio.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.3, audio.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + t + 0.25);
      o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.3);
    });
  } catch (e) {}
}
function relojTic(){
  reloj.restante = Math.max(0, (relojFin - Date.now()) / 1000);
  relojPintar();
  if (reloj.restante <= 0) { clearInterval(relojIntervalo); relojIntervalo = null; reloj.corriendo = false; sonar(); render(); }
}
function relojHTML(){
  const seg = Math.ceil(reloj.restante), mm = Math.floor(seg / 60), ss = String(seg % 60).padStart(2, '0');

    <div class="fila" style="justify-content:center">${[30, 60, 120, 180].map(t => `<button class="pildora" data-accion="reloj-tiempo" data-valor="${t}" aria-pressed="${reloj.total === t}">${t < 60 ? t + ' s' : t / 60 + ' min'}</button>`).join('')}</div>
    <div class="fila" style="justify-content:center">

}

    if (n.activo && CASOS2[n.activo]) { const c = CASOS2[n.activo]; return {clave:sc + n.activo, html:`<strong>Acciones que cuidan:</strong> ${c.acciones.filter(a => a.ok).map(a => a.t).join(' · ')} <br><span class="ley">Sustento: ${c.norma}</span>`}; }
    return {clave:sc, html:`<strong>Dónde están las situaciones:</strong> ${PROBLEMAS2.map(id => `${CASOS2[id].titulo} (${DONDE2[id]})`).join('; ')}. <strong>Buenos ejemplos:</strong> ${Object.keys(BUENOS2).map(id => `${BUENOS2[id].titulo} (${DONDE2[id]})`).join('; ')}.`};
  }
  if (sc === 'n2-frases' && state.n2) {
    const f = FRASES2[state.n2.fi];
    return {clave:sc + state.n2.fi, html:`<strong>${f.r === 'cuida' ? 'Cuida' : 'Hiere'}.</strong> Paso 2: ${f.paso2.ops.find(x => x.ok).t}`};
  }
  if (sc === 'n3-calentamiento' && state.n3) {
    const c = CALENTAMIENTO3[state.n3.ci];
    return {clave:sc + state.n3.ci, html:`<strong>${OPCIONES3.find(o => o.id === c.r).t}.</strong> ${EXPLICA3[c.r]}`};
  }
  if (sc === 'n3-duelo' && state.n3) {
    const d = DUELOS3[state.n3.di], orden = ['calma', 'disculpa', 'escucha', 'expresa', 'propone'];
    const ruta = orden.map(t => d.cartas.find(c => c.tipo === t)).filter(Boolean);
    return {clave:sc + d.id, html:`<strong>Una ruta gana-gana:</strong> ${ruta.map(c => c.titulo).join(' → ')}. <br>Cartas que no ayudan: ${d.cartas.filter(c => c.tipo === 'mala' || c.tipo === 'cede').map(c => c.titulo).join(' · ')}.`};
  }
  if (sc === 'n4-impuesta' && state.n4) {
    const c = IMPUESTA4[state.n4.ii];
    return {clave:sc + state.n4.ii, html:`<strong>${TIPOS4.find(t => t.id === c.r).t}.</strong> ${c.e}`};
  }
  if (sc === 'n4-inspector' && state.n4) {
    const r = REGLAS4[state.n4.ri];
    return {clave:sc + r.id, html:r.falla.length ? `<strong>Le falta:</strong> ${r.falla.map(f => CRITERIOS4.find(c => c.id === f).falta).join(' / ')}. <strong>Versión mejorada:</strong> ${r.opciones.find(o => o.ok).t}` : '<strong>Está lista:</strong> cumple los cuatro criterios.'};
  }
  if (sc.startsWith('caso-')) return {clave:sc, sinRespuesta:true, html:'<strong>Este momento no tiene una respuesta correcta.</strong> Pida a equipos con posturas distintas que expliquen sus razones antes de votar. No corrija posturas: pregunte por las razones, por las personas afectadas y por las consecuencias. Al final, valore que el curso pueda explicar por qué cambió o mantuvo su postura.'};
  if (sc === 'n4-pacto' || sc === 'n4-cartel') return {clave:sc, html:'Lean cada acuerdo en voz alta y voten a mano alzada. Si hay empate, abran un minuto de diálogo y voten de nuevo. Cuide que todos los equipos puedan proponer.'};
  return null;
}

function textoRegistro(sep){
  const cab = ['Estudiante'].concat(...['n1', 'n2', 'n3', 'n4'].map(nv => INDICADORES[nv].map((i, k) => `N${nv[1]}.${k + 1} ${i.c}`)));
  const filas = datosDocente.estudiantes.map(nombre => [nombre].concat(...['n1', 'n2', 'n3', 'n4'].map(nv => INDICADORES[nv].map((_, k) => ESCALA[((datosDocente.marcas[nv] || {})[nombre] || [])[k] || 0].l))));
  return [cab].concat(filas).map(f => f.map(c => sep === ';' ? `"${String(c).replace(/"/g, '""')}"` : c).join(sep)).join('\n');
}
function textoResultados(sep){
  const filas = [['Nivel', 'Pregunta', 'Veces', 'Acierto a la primera (%)']];
  ['n1', 'n2', 'n3', 'n4'].forEach(nv => filasResultados(nv).forEach(f => filas.push([NOMBRE_NIVEL[nv], f.et, f.r.n, f.pct])));
  const c = datosDocente.caso;
  if (c) [['si', 'Sí es justa'], ['no', 'No es justa'], ['duda', 'No estoy seguro']].forEach(([k, t]) => {
    filas.push(['El caso del balón', 'Postura al empezar: ' + t, c.inicial[k] || 0, '—']);
    filas.push(['El caso del balón', 'Postura al final: ' + t, c.final[k] || 0, '—']);
  });
  return filas.map(f => f.map(c => sep === ';' ? `"${String(c).replace(/"/g, '""')}"` : c).join(sep)).join('\n');
}

Object.assign(acciones, {
  escuchar(v){ hablar(v); },
  'doc-tab'(v){ state.docTab = v; state.msgReg = ''; state.msgRes = ''; state.confirmarBorrarReg = false; state.confirmarBorrarRes = false; },
  guia(v){
    if (v === 'cerrar') { state.guia = null; return; }
    if (v === 'guia' && state.guia && (state.guia === 'guia' || state.guia === true) ) { state.guia = null; return; }
    state.guia = v; state.errorGuia = '';
  },
  'guia-respuesta'(){ state.guiaResp = !state.guiaResp; },
  'reloj-tiempo'(v){ clearInterval(relojIntervalo); relojIntervalo = null; reloj.total = Number(v); reloj.restante = reloj.total; reloj.corriendo = false; },
  'reloj-iniciar'(){
    try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) {}
    if (reloj.corriendo) { clearInterval(relojIntervalo); relojIntervalo = null; reloj.corriendo = false; return; }
    if (reloj.restante <= 0) reloj.restante = reloj.total;
    relojFin = Date.now() + reloj.restante * 1000; reloj.corriendo = true;
    clearInterval(relojIntervalo); relojIntervalo = setInterval(relojTic, 200);
  },
  'reloj-reiniciar'(){ clearInterval(relojIntervalo); relojIntervalo = null; reloj.corriendo = false; reloj.restante = reloj.total; },
  'sorteo-cambiar'(v){ sorteo.equipos = Math.max(2, Math.min(10, sorteo.equipos + Number(v))); sorteo.bolsa = []; sorteo.ultimo = null; },
  sortear(){
    if (!sorteo.bolsa.length) sorteo.bolsa = mezclar(Array.from({length:sorteo.equipos}, (_, k) => k + 1));
    sorteo.ultimo = sorteo.bolsa.pop(); sorteo.giro++;
  },
  'lista-editar'(){ state.editLista = true; state.borradorLista = datosDocente.estudiantes.join('\n'); state.errorLista = ''; },
  'lista-cancelar'(){ state.editLista = false; state.borradorLista = null; state.errorLista = ''; },
  'lista-guardar'(){
    const texto = state.borradorLista !== undefined && state.borradorLista !== null ? state.borradorLista : datosDocente.estudiantes.join('\n');
    const nombres = [...new Set(texto.split('\n').map(x => x.trim()).filter(Boolean))].slice(0, 60);
    if (!nombres.length) { state.errorLista = 'Escribe al menos un nombre, uno por línea.'; return; }
    datosDocente.estudiantes = nombres; guardarDocente();
    state.editLista = false; state.borradorLista = null; state.errorLista = '';
  },
  'reg-nivel'(v){ state.regNivel = v; state.msgReg = ''; },
  marca(v){
    const [nv, e, k] = v.split('|'), nombre = datosDocente.estudiantes[Number(e)];
    if (!nombre) return;
    const m = datosDocente.marcas[nv] || (datosDocente.marcas[nv] = {});
    const fila = m[nombre] || (m[nombre] = [0, 0, 0, 0, 0]);
    fila[Number(k)] = ((fila[Number(k)] || 0) + 1) % ESCALA.length;
    guardarDocente(); state.msgReg = ''; state.confirmarBorrarReg = false;
  },
  'reg-copiar'(){ copiar(textoRegistro('\t'), r => { state.msgReg = r === 'ok' ? 'Copiado. Pégalo en Excel o en Google Sheets.' : MENSAJES_EXPORTAR.error; render(); }); },
  'reg-descargar'(){ descargar('registro-juego-limpio.csv', textoRegistro(';'), r => { state.msgReg = r === 'ok' ? 'Descarga lista.' : MENSAJES_EXPORTAR[r]; render(); }); },
  'reg-borrar'(){
    if (!state.confirmarBorrarReg) { state.confirmarBorrarReg = true; return; }
    datosDocente.estudiantes = []; datosDocente.marcas = {}; guardarDocente(); state.confirmarBorrarReg = false; state.msgReg = 'Registro borrado.';
  },
  'res-copiar'(){ copiar(textoResultados('\t'), r => { state.msgRes = r === 'ok' ? 'Copiado. Pégalo en Excel o en Google Sheets.' : MENSAJES_EXPORTAR.error; render(); }); },
  'res-descargar'(){ descargar('resultados-juego-limpio.csv', textoResultados(';'), r => { state.msgRes = r === 'ok' ? 'Descarga lista.' : MENSAJES_EXPORTAR[r]; render(); }); },
  'res-borrar'(){

    datosDocente.resultados = {}; datosDocente.partidas = {n1:0, n2:0, n3:0, n4:0}; datosDocente.caso = null; guardarDocente(); state.confirmarBorrarRes = false; state.msgRes = 'Resultados borrados.';
  }
});

function sumar(obj, clave){ obj[clave] = (obj[clave] || 0) + 1; }

function botonesPostura(accion){
  return `<div class="acciones2">${CASO.posturas.map(p => `<button class="accion2" data-accion="${accion}" data-valor="${p.id}">${ic(p.icono)}<span>${p.t}</span></button>`).join('')}</div>`;
}
function botonesRazon(postura, accion){
  return `<div class="acciones2">${CASO.razones[postura].map((r, k) => `<button class="accion2" data-accion="${accion}" data-valor="${k}"><span>${r}</span></button>`).join('')}
    <button class="accion2" data-accion="${accion}" data-valor="otra">${ic('message-circle')}<span>Tenemos otra razón: la decimos en voz alta.</span></button></div>`;
}
function tarjetaCaso(){
  return `<div class="afirmacion">${ic('quote', 'comillas')}<p>${CASO.texto}</p>${escuchar(CASO.texto, true, 'claro')}</div>`;
}
function resumenPostura(p){
  if (!p) return '<p class="suave">No se registró.</p>';
  return `<p class="sello derecho" style="align-self:flex-start">${ic(POSTURA[p.postura].icono)} ${POSTURA[p.postura].t}</p>
    <p><strong>Razón:</strong> ${textoRazon(p.postura, p.razon)}</p>`;
}

Object.assign(pantallas, {
  'caso-intro'(){
    const c = state.caso, t = state.casoTmp || {};
    let cuerpo;
    if (c.inicial && !t.rehacer) {
      cuerpo = `<div class="resultado entra" role="status">
          <h3>${ic('circle-check')} Tu primera postura quedó guardada</h3>
          ${resumenPostura(c.inicial)}
          <p>Al terminar el nivel 4 volverás a este caso para ver si cambias o mantienes tu postura.</p>
        </div>
        <div class="fila">
          <button class="btn btn-principal" data-accion="ir" data-valor="n1-intro">${ic('play')} Ir al nivel 1</button>
          <button class="btn" data-accion="ir" data-valor="vestuario">${ic('house')} Volver al vestuario</button>
          <button class="btn btn-chico" data-accion="caso-rehacer">${ic('rotate-ccw')} Responder de nuevo</button>
        </div>`;
    } else if (!t.postura) {
      cuerpo = `<p class="pregunta"><span class="paso-n">Paso 1</span> ${CASO.pregunta}</p>${botonesPostura('caso-postura')}`;
    } else {
      cuerpo = `<p class="pregunta"><span class="paso-n">Paso 2</span> ¿Cuál es tu razón principal?</p>
        <p class="sello derecho" style="align-self:flex-start">${ic(POSTURA[t.postura].icono)} ${POSTURA[t.postura].t}</p>
        ${botonesRazon(t.postura, 'caso-razon')}`;
    }
    return `<div class="app">${barra('El caso del balón', 'vestuario')}
      <div class="pila">
        <p class="etiqueta" style="align-self:flex-start">${ic('volleyball')} Antes de empezar · Tu primera postura</p>
        ${tarjetaCaso()}
        <div class="aviso">${ic('info')}<p><strong>Aquí no hay una respuesta correcta.</strong> Queremos saber qué piensas ahora y por qué. Si juegan con todo el curso, cada equipo explica su postura antes de votar.</p></div>
        ${cuerpo}
      </div>
    </div>`;
  },

  'caso-revision'(){
    const c = state.caso, r = state.casoRev || (state.casoRev = {paso:0, resp:[], final:null, razonFinal:null, propuesta:null});
    const y = CASO.ysi[r.paso], resp = r.resp[r.paso];
    const ultimo = r.paso === CASO.ysi.length - 1;
    return `<div class="app">${barra('Vuelve el caso del balón', 'vestuario')}
      <div class="pips" aria-hidden="true">${CASO.ysi.map((_, k) => `<span class="${k < r.paso ? 'ok' : k === r.paso ? 'ahora' : ''}"></span>`).join('')}<span></span></div>
      <div class="pila">
        <details class="tarjeta"><summary><strong>Recuerda el caso y tu primera postura</strong></summary>
          <div class="pila" style="margin-top:10px">${tarjetaCaso()}${resumenPostura(c.inicial)}</div>
        </details>
        <p class="etiqueta" style="align-self:flex-start">${ic('lightbulb')} ¿Y si…? ${r.paso + 1} de ${CASO.ysi.length}</p>
        <div class="afirmacion">${ic('message-circle-question', 'comillas')}<p>${y.t}</p>${escuchar(y.t, true, 'claro')}</div>
        ${!resp ? `<p class="pregunta">¿Esto cambia lo que piensas sobre la regla de Nicolás?</p>
          <div class="acciones2">${CASO.cambia.map(o => `<button class="accion2" data-accion="caso-ysi" data-valor="${o.id}">${ic(o.icono)}<span>${o.t}</span></button>`).join('')}</div>`
        : `<div class="resultado entra" role="status">
            <p class="sello derecho" style="align-self:flex-start">${ic(CASO.cambia.find(o => o.id === resp).icono)} ${CASO.cambia.find(o => o.id === resp).t}</p>
            <h3>${ic('lightbulb')} Para pensar</h3>
            <p style="font-size:1.08rem">${y.pensar} ${escuchar(y.pensar)}</p>
            ${y.ley ? `<p class="ley">${ic('book-open')} Lo dice: ${y.ley}</p>` : ''}
          </div>
          <div class="derecha"><button class="btn btn-cancha" data-accion="caso-ysi-siguiente">${ultimo ? 'Tu postura final' : 'Siguiente'} ${ic('arrow-right')}</button></div>`}
      </div>
    </div>`;
  },

  'caso-final'(){
    const c = state.caso, r = state.casoRev || (state.casoRev = {paso:0, resp:[], final:null, razonFinal:null, propuesta:null});
    let cuerpo;
    if (!r.final) {
      cuerpo = `<p class="pregunta"><span class="paso-n">Paso 1</span> Después de pensar en todo esto, ¿es justa la regla de Nicolás?</p>${botonesPostura('caso-final')}`;
    } else if (r.razonFinal === null) {
      cuerpo = `<p class="pregunta"><span class="paso-n">Paso 2</span> ¿Cuál es ahora tu razón principal?</p>
        <p class="sello derecho" style="align-self:flex-start">${ic(POSTURA[r.final].icono)} ${POSTURA[r.final].t}</p>
        ${botonesRazon(r.final, 'caso-razon-final')}`;
    } else if (!r.propuesta) {
      cuerpo = `<p class="pregunta"><span class="paso-n">Paso 3</span> ¿Qué regla propondrían para el balón?</p>
        <div class="aviso">${ic('scale')}<p>Antes de elegir, revisen la propuesta con el <strong>medidor de regla justa</strong>: ¿es igual para todos?, ¿cuida los derechos de todos?, ¿es clara?, ¿se puede cumplir?</p></div>
        <div class="acciones2">${CASO.propuestas.map(p => `<button class="accion2" data-accion="caso-propuesta" data-valor="${p.id}"><span>${p.t}</span></button>`).join('')}</div>`;
    } else {
      const cambio = c.inicial && c.inicial.postura !== r.final;
      cuerpo = `<div class="comparar">
          <section class="tarjeta pila" style="gap:8px"><h3>Al empezar</h3>${resumenPostura(c.inicial)}</section>
          <section class="tarjeta pila" style="gap:8px"><h3>Ahora</h3>${resumenPostura({postura:r.final, razon:r.razonFinal})}
            <p><strong>Propuesta:</strong> ${CASO.propuestas.find(p => p.id === r.propuesta).t}</p></section>
        </div>
        <div class="resultado entra" role="status">
          <h3>${ic(cambio ? 'rotate-ccw' : 'circle-check')} ${!c.inicial ? 'Tu postura quedó registrada' : cambio ? 'Cambiaste de postura' : 'Mantuviste tu postura'}</h3>
          <p style="font-size:1.08rem">${!c.inicial ? 'Ahora puedes explicar tu postura con razones.' : cambio ? 'Cambiar de opinión cuando aparecen buenas razones es parte de pensar éticamente.' : 'Mantener una postura también vale, si ahora puedes explicarla mejor y tener en cuenta a los demás.'}</p>
        </div>
        <div class="pista">${ic('notebook-pen')}<p><strong>Para tu cuaderno:</strong> escribe qué te hizo cambiar o mantener tu postura y qué regla propones para el balón. Revísala con las cuatro preguntas del medidor.</p></div>
        <div class="fila"><button class="btn btn-cancha" data-accion="ir" data-valor="vestuario">${ic('house')} Volver al vestuario</button></div>`;
    }
    return `<div class="app">${barra('Tu postura final', 'vestuario')}
      <div class="pila">
        ${tarjetaCaso()}
        ${cuerpo}
      </div>
    </div>`;
  }
});

Object.assign(acciones, {
  'caso-empezar'(){ state.casoTmp = {}; state.screen = 'caso-intro'; },
  'caso-rehacer'(){ state.casoTmp = {rehacer:true}; },
  'caso-postura'(v){ state.casoTmp = Object.assign(state.casoTmp || {}, {postura:v}); },
  'caso-razon'(v){
    const t = state.casoTmp, d = datosCaso(), antes = state.caso.inicial;
    if (antes && d.inicial[antes.postura] > 0) d.inicial[antes.postura]--;
    state.caso.inicial = {postura:t.postura, razon:v};
    sumar(d.inicial, t.postura); guardarDocente();
    state.casoTmp = {}; guardar();
  },
  'caso-revisar'(){ state.casoRev = {paso:0, resp:[], final:null, razonFinal:null, propuesta:null}; state.screen = 'caso-revision'; },
  'caso-ysi'(v){ const r = state.casoRev; r.resp[r.paso] = v; sumar(datosCaso().ysi[r.paso], v); guardarDocente(); },
  'caso-ysi-siguiente'(){ const r = state.casoRev; if (r.paso < CASO.ysi.length - 1) r.paso++; else state.screen = 'caso-final'; },
  'caso-final'(v){ state.casoRev.final = v; },
  'caso-razon-final'(v){ state.casoRev.razonFinal = v; },
  'caso-propuesta'(v){
    const r = state.casoRev, c = state.caso, d = datosCaso();
    r.propuesta = v;
    sumar(d.final, r.final); sumar(d.propuestas, v); d.revisiones++;
    if (c.inicial && c.inicial.postura !== r.final) d.cambios++;
    guardarDocente();
    c.final = {postura:r.final, razon:r.razonFinal, propuesta:v}; guardar();
  }
});


let pantallaPrevia = null;
function render(){
  document.documentElement.classList.toggle('proyector', state.proyector);
  const html = (pantallas[state.screen] || pantallas.inicio)();
  document.getElementById('raiz').innerHTML = html;
  if (pantallaPrevia !== state.screen) {
    detenerVoz();
    window.scrollTo(0, 0);
    const t = document.getElementById('titulo-pantalla');
    if (t && pantallaPrevia !== null) t.focus({preventScroll:true});
    pantallaPrevia = state.screen;
  }
  if (state.n1) { state.n1.sacudir = ''; if (state.screen === 'n1-cierre') state.n1.laminaVista = true; }
  if (state.n2) { state.n2.sacudir = ''; if (state.screen === 'n2-cierre') state.n2.laminaVista = true; }
  if (state.n3 && state.screen === 'n3-cierre') state.n3.laminaVista = true;
  if (state.n4) { state.n4.sacudir = ''; if (state.screen === 'n4-cierre') state.n4.laminaVista = true; }
  document.querySelectorAll('[data-anima]').forEach(el => {
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.width = el.dataset.anima + '%'; }));
  });
  if (state.desplazar) {
    const d = document.getElementById(state.desplazar);
    state.desplazar = null;
    if (d) d.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest'});
  }
}

function ejecutar(b, e){
  const f = acciones[b.dataset.accion];
  if (!f) return;
  const antes = state.screen;
  f(b.dataset.valor);
  render();
  if (antes === state.screen && e.detail === 0) {
    const sel = '[data-accion="' + b.dataset.accion + '"]' + (b.dataset.valor ? '[data-valor="' + b.dataset.valor + '"]' : '');
    const nb = document.querySelector(sel) || document.querySelector('#raiz button');
    if (nb) nb.focus();
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-accion]');
  if (b) ejecutar(b, e);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const b = e.target.closest && e.target.closest('[data-accion]');
  if (!b || b.tagName === 'BUTTON') return;
  e.preventDefault();
  ejecutar(b, {detail: 0});
});
document.addEventListener('input', e => {
  if (e.target.id === 'propio-texto' && state.n4) { state.n4.borrador = e.target.value.slice(0, 120); return; }
  if (e.target.id === 'curso' && state.n4) { state.n4.curso = e.target.value.slice(0, 20); return; }
  if (e.target.id === 'apodo') {
    state.avatar.apodo = e.target.value.slice(0, 14);
    const v = document.getElementById('nombre-vista');
    if (v) v.textContent = state.avatar.apodo || 'Tu jugador';
    guardar();
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'form-clave') return;
  e.preventDefault();
  const val = (document.getElementById('clave').value || '').trim();
  if (val === CLAVE) { state.errorClave = ''; state.docenteOk = true; state.screen = 'docente'; }
  else { state.errorClave = val ? 'Clave incorrecta. Revisa la pista.' : 'Escribe la clave para entrar.'; }
  render();
  if (state.screen === 'docente-clave') { const c = document.getElementById('clave'); if (c) c.focus(); }
});

function start(data){
  try {
    const g = JSON.parse(localStorage.getItem('juego-limpio') || 'null');
    if (g) {
      if (g.avatar) Object.assign(state.avatar, g.avatar);
      if (g.progreso) state.progreso = g.progreso;
      state.proyector = !!g.proyector; state.avatarListo = !!g.avatarListo;
      if (g.caso) state.caso = Object.assign({inicial:null, final:null}, g.caso);
    }
  } catch(e) {}
  if (data && data.screen) state = Object.assign(state, data);
  render();
}
window.claude?.hot?.snapshot?.(() => state);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
