<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juego Limpio</title>
<style>
@font-face{font-family:"Lilita One";src:url(data:font/woff2;base64,__FONT_LILITA__) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(data:font/woff2;base64,__FONT_ATK400__) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(data:font/woff2;base64,__FONT_ATK700__) format("woff2");font-weight:700;font-display:swap}
:root{
/* Inicio sobre una cancha con líneas de tiza; dentro del juego, tarjetas blancas sobre fondo claro y un solo acento fuerte: el amarillo del marcador */
--cancha:#1d7a4e;--cancha-2:#218656;--cancha-osc:#135437;
--tinta:#15233c;--tinta-2:#4a5873;--fondo:#f1f5f0;--tarjeta:#ffffff;--linea:#d4ded5;
--acento:#ffb703;--acento-suave:#fff3cf;
--ok:#16704a;--ok-fondo:#e0f2e7;--riesgo:#9c4706;--riesgo-fondo:#ffefd6;
--info:#22579a;--info-fondo:#e7eff9;
--display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
--texto:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--radio:14px;
color-scheme:light;
}
*{box-sizing:border-box}
html{font-size:17px;height:100%}
html.proyector{font-size:21px}
body{margin:0;height:100%;background:var(--fondo);color:var(--tinta);font-family:var(--texto);line-height:1.5;-webkit-font-smoothing:antialiased}
#raiz{min-height:100%;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
.ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.22em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{width:100%;max-width:900px;margin:0 auto;padding:0 16px 56px}
html.proyector .app{max-width:1200px}
.barra{display:flex;align-items:center;gap:12px;padding:14px 0;position:sticky;top:0;background:var(--fondo);z-index:5}
.barra h2{font-size:1.4rem;flex:1;min-width:0}
.btn-icono{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--linea);background:var(--tarjeta);display:grid;place-items:center;flex:none}
.btn-icono:hover{border-color:var(--tinta-2)}
.interruptor{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--linea);background:var(--tarjeta);font-size:.85rem;font-weight:700;flex:none}
.interruptor[aria-pressed="true"]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 24px;border-radius:var(--radio);border:2px solid var(--tinta);background:var(--tarjeta);font-weight:700;font-size:1rem;transition:transform .12s,box-shadow .12s;text-decoration:none}
.btn:hover{transform:translateY(-1px)}
.btn-principal{background:var(--acento);color:var(--tinta);box-shadow:0 4px 0 var(--tinta)}
.btn-principal:active{box-shadow:0 1px 0 var(--tinta);transform:translateY(3px)}
.btn-cancha{background:var(--cancha);color:#fff;border-color:var(--cancha-osc);box-shadow:0 4px 0 var(--cancha-osc)}
.btn-cancha:active{box-shadow:0 1px 0 var(--cancha-osc);transform:translateY(3px)}
.btn-chico{min-height:42px;padding:0 14px;font-size:.88rem;border-width:1.5px}
.tarjeta{background:var(--tarjeta);border:1.5px solid var(--linea);border-radius:18px;padding:20px}
.etiqueta{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--fondo);color:var(--tinta-2)}
.pila{display:flex;flex-direction:column;gap:16px}
.fila{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sacude{animation:sacude .42s}
@keyframes sacude{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes entra{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.entra{animation:entra .35s ease-out both}

/* Inicio */
.campo{position:relative;flex:1;min-height:560px;background:repeating-linear-gradient(90deg,var(--cancha) 0 72px,var(--cancha-2) 72px 144px);color:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:56px 20px;text-align:center}
.campo .tiza{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.campo .contenido{position:relative;max-width:680px;display:flex;flex-direction:column;align-items:center;gap:20px}
.marcador{display:inline-flex;gap:10px;align-items:center;background:var(--tinta);color:var(--acento);font-family:var(--display);padding:7px 16px;border-radius:10px;font-size:.95rem;letter-spacing:.08em}
.titulo-juego{font-size:clamp(3.2rem,11vw,6rem);color:#fff;text-shadow:0 5px 0 var(--cancha-osc);letter-spacing:.02em}
.campo .lema{font-size:1.15rem;max-width:34ch;color:#f2fbf5}
.campo .acciones{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:6px}
.btn-claro{background:transparent;color:#fff;border-color:rgba(255,255,255,.85)}
.campo .interruptor{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.5)}
.campo .interruptor[aria-pressed="true"]{background:#fff;color:var(--tinta)}
.campo .pie{font-size:.82rem;color:#d4efdf}

/* Avatar */
.avatar-grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
.avatar-vista{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;position:sticky;top:84px}
.avatar-vista .marco{width:220px;height:220px;border-radius:50%;background:var(--ok-fondo);display:grid;place-items:center;overflow:hidden;border:3px solid var(--cancha)}
.avatar-vista .marco svg{width:200px;height:200px;margin-top:22px}
.opcion h3{font-size:1.05rem;margin-bottom:10px}
.muestras{display:flex;flex-wrap:wrap;gap:10px}
.muestra{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--linea)}
.muestra[aria-pressed="true"]{box-shadow:0 0 0 3px var(--tinta)}
.pildora{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--linea);background:var(--tarjeta);font-weight:700;font-size:.9rem}
.pildora[aria-pressed="true"]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.numero{display:flex;align-items:center;gap:10px}
.numero output{font-family:var(--display);font-size:1.8rem;min-width:2.4ch;text-align:center}
.campo-texto{width:100%;max-width:320px;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--linea);background:var(--tarjeta)}
.campo-texto:focus{border-color:var(--info);outline:none;box-shadow:0 0 0 3px var(--info-fondo)}

/* Vestuario */
.perfil{display:flex;align-items:center;gap:18px}
.perfil .mini{width:96px;height:96px;border-radius:50%;background:var(--ok-fondo);border:3px solid var(--cancha);overflow:hidden;display:grid;place-items:center;flex:none}
.perfil .mini svg{width:88px;height:88px;margin-top:12px}
.perfil h3{font-size:1.6rem}
.fichas{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.ficha{display:flex;flex-direction:column;gap:6px;text-align:left;border-radius:18px;padding:18px;border:1.5px solid var(--linea);background:var(--tarjeta)}
button.ficha:hover{border-color:var(--tinta-2)}
.ficha .grande{font-family:var(--display);font-size:2rem;line-height:1}
.ficha .titulo{display:flex;align-items:center;gap:8px;font-weight:700}
.album{display:flex;gap:8px;margin-top:4px}
.album .slot{width:46px;height:58px;border-radius:8px;border:2px dashed var(--linea);display:grid;place-items:center;color:var(--linea)}
.album .slot.ganada{border:2px solid var(--cancha);background:var(--ok-fondo);color:var(--cancha);transform:rotate(-3deg)}
.niveles{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.nivel{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px;border-radius:18px;background:var(--tarjeta);border:1.5px solid var(--linea)}
.nivel .num{font-family:var(--display);font-size:2.2rem;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;background:var(--fondo);color:var(--tinta-2)}
.nivel.activo{border:2.5px solid var(--tinta)}
.nivel.activo .num{background:var(--acento);color:var(--tinta)}
.nivel h4{font-size:1.25rem}
.nivel .momento{font-size:.88rem;color:var(--tinta-2)}
.nivel .pronto{font-size:.82rem;font-weight:700;color:var(--tinta-2);background:var(--fondo);padding:6px 12px;border-radius:999px}
.hecho{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:700;font-size:.85rem}

/* Mochila */
.derechos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.derecho{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--tarjeta);border:1.5px solid var(--linea)}
.derecho .circulo{width:46px;height:46px;border-radius:50%;background:var(--ok-fondo);color:var(--cancha);display:grid;place-items:center;flex:none}
.derecho strong{display:block;font-size:1rem}
.derecho span{font-size:.88rem;color:var(--tinta-2)}
.caso-ficha{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--tarjeta);border:1.5px solid var(--linea);border-radius:20px;padding:16px 18px}
.caso-ficha.activo{border-color:var(--acento);box-shadow:0 0 0 3px var(--acento-suave)}
.caso-ficha h4{font-size:1.2rem}
.caso-ficha .circulo{width:48px;height:48px;border-radius:14px;background:var(--acento-suave);display:grid;place-items:center;flex:none}
.caso-ficha .circulo .ic{color:#8a5a00}
.comparar{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.credito{font-size:.8rem;opacity:.85;margin-top:2px}
.credito-pie{text-align:center;font-size:.8rem;color:var(--tinta-2);margin-top:8px}
details.tarjeta summary{cursor:pointer}
.aviso{display:flex;gap:12px;align-items:flex-start;background:var(--info-fondo);color:#16365f;border-radius:16px;padding:16px 18px}
.aviso .ic{color:var(--info);margin-top:2px}

/* Nivel 1 */
.pasos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pasos li{display:flex;gap:12px;align-items:flex-start;background:var(--tarjeta);border:1.5px solid var(--linea);border-radius:16px;padding:16px}
.pasos .n{font-family:var(--display);font-size:1.5rem;width:42px;height:42px;border-radius:12px;background:var(--acento);display:grid;place-items:center;flex:none}
.pips{display:flex;gap:4px;margin-bottom:14px}
.pips span{flex:1;height:7px;border-radius:4px;background:var(--linea)}
.pips span.ok{background:var(--cancha)}
.pips span.ahora{background:var(--acento)}
.caso{position:relative;overflow:hidden;background:var(--tarjeta);border:2px solid var(--tinta);border-radius:22px;padding:24px 24px 26px;box-shadow:0 6px 0 var(--tinta)}
.caso .texto{font-size:1.4rem;line-height:1.4;margin-top:12px;max-width:46ch}
.caso.escanea::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--acento);animation:escaneo 1s ease-in-out 1 forwards;opacity:0}
@keyframes escaneo{0%{top:0;opacity:1}85%{opacity:1}100%{top:100%;opacity:0}}
.lugar-casa{background:#fde9e4;color:#8a2d14}
.lugar-colegio{background:var(--info-fondo);color:#16365f}
.lugar-barrio{background:var(--ok-fondo);color:#0f4f33}
.lugar-internet{background:#efe7fb;color:#4a2a80}
.pregunta{font-weight:700;font-size:1.05rem;display:flex;gap:8px;align-items:center}
.paso-n{white-space:nowrap;font-family:var(--display);font-weight:400;font-size:.9rem;background:var(--tinta);color:#fff;border-radius:8px;padding:2px 8px}
.estados{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.estado{display:flex;align-items:center;justify-content:center;gap:12px;min-height:82px;border-radius:18px;font-family:var(--display);font-size:1.5rem;border:2.5px solid currentColor;transition:transform .12s}
.estado:hover{transform:translateY(-2px)}
.estado .ic{width:1.4em;height:1.4em}
.estado.cuidado{background:var(--ok-fondo);color:var(--ok)}
.estado.riesgo{background:var(--riesgo-fondo);color:var(--riesgo)}
.opciones-derecho{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.op-derecho{display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 12px;border-radius:14px;border:1.5px solid var(--linea);background:var(--tarjeta);text-align:left;font-weight:700;font-size:.92rem;line-height:1.2}
.op-derecho:hover{border-color:var(--tinta)}
.op-derecho .ic{color:var(--cancha)}
.op-derecho.descartado{opacity:.45;text-decoration:line-through}
.pista{display:flex;gap:10px;align-items:flex-start;background:var(--acento-suave);border-radius:14px;padding:12px 14px;color:#5c3d00}
.resultado{border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--cancha);background:var(--tarjeta)}
.resultado h3{font-size:1.6rem;color:var(--cancha);display:flex;align-items:center;gap:10px}
.sello{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:12px;font-weight:700;font-size:.92rem}
.sello.cuidado{background:var(--ok-fondo);color:var(--ok)}
.sello.riesgo{background:var(--riesgo-fondo);color:var(--riesgo)}
.sello.derecho{background:var(--fondo);color:var(--tinta)}
.ley{font-size:.85rem;color:var(--tinta-2);display:flex;gap:6px;align-items:center}
.conversar{display:flex;gap:12px;align-items:flex-start;background:var(--info-fondo);color:#16365f;border-radius:14px;padding:14px 16px}
.conversar strong{display:block}
.derecha{display:flex;justify-content:flex-end}

/* Mito o verdad */
.afirmacion{position:relative;background:var(--tinta);color:#fff;border-radius:22px;padding:30px 26px;font-size:1.5rem;line-height:1.4}
.afirmacion .ic.comillas{position:absolute;top:14px;left:16px;width:28px;height:28px;color:var(--acento);opacity:.9}
.afirmacion p{padding-left:30px}
.mv{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mv .estado.mito{background:#fde9e4;color:#8a2d14}
.mv .estado.verdad{background:var(--ok-fondo);color:var(--ok)}

/* Cierre */
.cierre{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;align-items:center}
.lamina{position:relative;background:var(--tarjeta);border:4px solid var(--cancha);border-radius:20px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transform:rotate(-4deg);box-shadow:0 8px 0 var(--cancha-osc);animation:pega .7s cubic-bezier(.2,1.4,.4,1) both}
.lamina.quieta{animation:none}
@keyframes pega{from{transform:rotate(-20deg) scale(.4);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
.lamina .numl{font-family:var(--display);font-size:1rem;background:var(--tinta);color:var(--acento);padding:2px 10px;border-radius:8px;align-self:flex-start}
.lamina .icono-l{width:96px;height:96px;border-radius:50%;background:var(--acento);display:grid;place-items:center;color:var(--tinta)}
.lamina .icono-l .ic{width:52px;height:52px}
.lamina h3{font-size:1.4rem}
.lamina p{font-size:.9rem;color:var(--tinta-2)}
.datos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dato{background:var(--tarjeta);border:1.5px solid var(--linea);border-radius:14px;padding:12px}
.dato b{display:block;font-family:var(--display);font-weight:400;font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.dato span{font-size:.82rem;color:var(--tinta-2)}
.autoeval{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.autoeval button{min-height:58px;border-radius:14px;border:1.5px solid var(--linea);background:var(--tarjeta);font-weight:700;padding:8px 12px}
.autoeval button[aria-pressed="true"]{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.cuaderno{display:flex;gap:12px;align-items:flex-start;background:var(--acento-suave);border-radius:16px;padding:16px;color:#4d3300}

/* Nivel 2 */
.marcador2{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;background:var(--tarjeta);border:1.5px solid var(--linea);border-radius:16px;padding:12px 16px}
.marcador2>div{display:flex;align-items:center;gap:10px}
.marcador2 .rotulo{font-size:.85rem;font-weight:700;color:var(--tinta-2)}
.marcador2 b{font-family:var(--display);font-weight:400;font-size:1.2rem;font-variant-numeric:tabular-nums}
.marcador2 .btn{margin-left:auto}
.puntos{display:flex;gap:5px}
.punto{width:14px;height:14px;border-radius:50%;background:var(--linea)}
.punto.p{background:var(--acento);box-shadow:inset 0 0 0 2px var(--tinta)}
.punto.b{background:var(--cancha)}
.patio-marco{border:2px solid var(--tinta);border-radius:22px;overflow-x:auto;background:#eadfca;box-shadow:0 6px 0 var(--tinta)}
.patio{display:block;width:100%;min-width:820px;height:auto;cursor:zoom-in}
.escena{cursor:zoom-in;outline:none}
.escena:focus-visible .zona{stroke:var(--info);stroke-width:5;stroke-dasharray:10 8}
.zona.activa{stroke:#ffb703;stroke-width:5;stroke-dasharray:12 8}
.anillo{animation:pulso 1s ease-in-out infinite}
@keyframes pulso{50%{stroke-opacity:.2}}
.caras{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cara{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;border:1.5px solid var(--linea);background:var(--tarjeta);font-weight:700;font-size:.9rem}
.cara:hover{border-color:var(--tinta)}
.cara svg{width:56px;height:56px}
.acciones2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.accion2{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--linea);background:var(--tarjeta);font-weight:700;font-size:.95rem}
.accion2:hover{border-color:var(--tinta)}
.accion2 small{font-weight:400;font-size:.88rem;display:flex;gap:6px;align-items:flex-start}
.accion2.buena{border-color:var(--ok);background:var(--ok-fondo);color:#0f4f33}
.accion2.mala{border-color:var(--riesgo);background:var(--riesgo-fondo);color:#6b3104}

.solo-movil{display:none}
@media (max-width:820px){.solo-movil{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--tinta-2)}}

/* Nivel 3 */
.maestra{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.maestra span{background:var(--acento-suave);color:#5c3d00;font-weight:700;padding:8px 12px;border-radius:12px}
.maestra .ic{color:var(--tinta-2)}
.arena{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:start;background:var(--tarjeta);border:2px solid var(--tinta);border-radius:22px;padding:20px;box-shadow:0 6px 0 var(--tinta)}
.lado{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.retrato{width:110px;height:110px;border-radius:50%;background:var(--ok-fondo);border:3px solid var(--cancha);overflow:hidden;display:grid;place-items:center}
.retrato svg{width:100px;height:100px;margin-top:14px}
.quiere{font-size:.98rem;background:var(--fondo);border-radius:14px;padding:10px 12px;min-height:3.2em;width:100%}
.vs{display:flex;flex-direction:column;align-items:center;gap:6px;align-self:center;color:var(--tinta-2);font-family:var(--display);font-size:1rem;text-align:center}
.vs .ic{width:40px;height:40px;color:var(--cancha)}
.medidor{width:100%;text-align:left}
.medidor-fila{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:4px}
.medidor-pista{position:relative;height:18px;border-radius:9px;background:var(--fondo);border:1.5px solid var(--linea);overflow:hidden}

textarea.area{max-width:100%;height:auto;padding:12px;font:inherit;line-height:1.5}

.tabla-envoltura{overflow-x:auto;border:1.5px solid var(--linea);border-radius:14px;background:var(--tarjeta)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.88rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--linea);vertical-align:top}
th{background:var(--fondo);font-weight:700}
tr:last-child td{border-bottom:none}

.error{color:#a3261b;font-size:.9rem;font-weight:700;min-height:1.4em}

  .retrato svg{width:78px;height:78px;margin-top:12px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  },

  'n1-escaner'(){
    const n = state.n1, s = S[n.orden[n.i]], L = LUGARES[s.lugar];
    const pips = n.orden.map((_, k) => `<span class="${k < n.i ? 'ok' : k === n.i ? 'ahora' : ''}"></span>`).join('');
    let cuerpo = '';
    if (n.fase === 'estado') {
      cuerpo = `<p class="pregunta"><span class="paso-n">Paso 1</span> ¿Cómo está el derecho en esta situación?</p>
        <div class="estados${n.sacudir === 'estado' ? ' sacude' : ''}">
          <button class="estado cuidado" data-accion="estado" data-valor="cuidado">${ic('shield-check')} Cuidado</button>
          <button class="estado riesgo" data-accion="estado" data-valor="riesgo">${ic('triangle-alert')} En riesgo</button>
        </div>`;
    } else if (n.fase === 'derecho') {
      cuerpo = `<div class="fila"><span class="sello ${s.estado}">${ic(s.estado === 'cuidado' ? 'shield-check' : 'triangle-alert')} ${s.estado === 'cuidado' ? 'Derecho cuidado' : 'Derecho en riesgo'}</span></div>
        <p class="pregunta"><span class="paso-n">Paso 2</span> ¿Cuál derecho está en juego?</p>
        <div class="opciones-derecho${n.sacudir === 'derecho' ? ' sacude' : ''}">
          ${DERECHOS.map(d => `<button class="op-derecho${n.descartados.includes(d.id) ? ' descartado' : ''}" data-accion="derecho" data-valor="${d.id}">${ic(d.icono)}<span>${d.nombre}</span></button>`).join('')}
        </div>`;
    } else {
      const principal = D[s.derecho];
      const otro = n.elegido && n.elegido !== s.derecho ? D[n.elegido] : null;
      const titulo = n.revelado ? 'Mira la respuesta' : (n.okEstado && n.okDerecho ? '¡Bien visto!' : '¡Lo encontraste!');
      const ultimo = n.i === n.orden.length - 1;
      cuerpo = `<div class="resultado entra" role="status">
          <h3>${ic(n.revelado ? 'lightbulb' : 'circle-check')} ${titulo}</h3>
          <div class="fila">
            <span class="sello ${s.estado}">${ic(s.estado === 'cuidado' ? 'shield-check' : 'triangle-alert')} ${s.estado === 'cuidado' ? 'Derecho cuidado' : 'Derecho en riesgo'}</span>
            <span class="sello derecho">${ic(principal.icono)} ${principal.nombre}</span>
          </div>
          ${otro ? `<p><strong>${otro.nombre}</strong> también aplica. El derecho que más está en juego es <strong>${principal.nombre}</strong>.</p>` : ''}
          <p style="font-size:1.08rem">${s.explica} ${escuchar(s.explica)}</p>
          <p class="ley">${ic('book-open')} Lo dice: ${s.norma}</p>
        </div>
        ${s.acciones ? `<p class="pregunta"><span class="paso-n">Paso 3</span> ¿Qué se podría hacer para cuidar este derecho?</p>
          <div class="acciones2">${(n.ordenAcc || []).map(k => { const a = s.acciones[k], vista = n.accVistas.includes(k);
            return `<button class="accion2${vista ? (a.ok ? ' buena' : ' mala') : ''}" data-accion="accion1" data-valor="${k}" aria-pressed="${vista}"><span>${a.t}</span>${vista ? `<small>${ic(a.ok ? 'circle-check' : 'circle-x')} ${a.c}</small>` : ''}</button>`; }).join('')}</div>` : ''}
        ${!s.acciones || n.accionOk ? `${s.conversar ? `<div class="conversar entra">${ic('message-circle-question')}<div><strong>Para conversar</strong>${s.conversar}</div></div>` : ''}
        <div class="derecha"><button class="btn btn-cancha" data-accion="siguiente">${ultimo ? 'Ir a Mito o verdad' : 'Siguiente situación'} ${ic('arrow-right')}</button></div>` : ''}`;
    }
    return `<div class="app">${barra('Escáner de derechos', 'vestuario')}
      <p class="sr" aria-live="polite">Situación ${n.i + 1} de ${n.orden.length}</p>
      <div class="pips" aria-hidden="true">${pips}</div>
      <div class="pila">
        <article class="caso${n.fase === 'estado' && !n.sacudir ? ' escanea' : ''}">
          <div class="fila" style="justify-content:space-between">
            <span class="etiqueta lugar-${s.lugar}">${ic(L.icono)} ${L.nombre}</span>
            <span class="etiqueta">Situación ${n.i + 1} de ${n.orden.length}</span>
          </div>
          <p class="texto">${s.texto}</p>
          <div style="margin-top:12px">${escuchar(s.texto, true)}</div>
        </article>
        ${cuerpo}
        ${n.pista ? `<div class="pista" role="status">${ic('lightbulb')}<p>${n.pista}</p></div>` : ''}
      </div>
    </div>`;
  },

  'n1-mitos'(){
    const n = state.n1, m = MITOS[n.mi];
    let cuerpo;
    if (!n.respMito) {
      cuerpo = `<p class="pregunta">¿Es un mito o es verdad?</p>
        <div class="mv">
          <button class="estado mito" data-accion="mito" data-valor="mito">${ic('circle-x')} Mito</button>
          <button class="estado verdad" data-accion="mito" data-valor="verdad">${ic('circle-check')} Verdad</button>
        </div>`;
    } else {
      const bien = n.respMito === m.resp;
      const ultimo = n.mi === MITOS.length - 1;
      const veredicto = `${ic(bien ? 'circle-check' : 'lightbulb')} ${bien ? '¡Correcto!' : 'Esta vez no.'} ${m.resp === 'mito' ? 'Es un mito.' : 'Es verdad.'}`;
      if (n.porqueResp === null) {
        cuerpo = `<div class="resultado entra" role="status"><h3>${veredicto}</h3></div>
          <p class="pregunta"><span class="paso-n">Paso 2</span> ¿Por qué?</p>
          <div class="acciones2">${(n.ordenPorque || []).map(k => `<button class="accion2" data-accion="porque1" data-valor="${k}"><span>${m.porque[k].t}</span></button>`).join('')}</div>`;
      } else {
        const pq = m.porque[n.porqueResp], correcto = m.porque.find(x => x.ok);
        cuerpo = `<div class="resultado entra" role="status">
          <h3>${veredicto}</h3>
          <p class="sello ${pq.ok ? 'cuidado' : 'riesgo'}" style="align-self:flex-start">${ic(pq.ok ? 'circle-check' : 'circle-x')} ${pq.ok ? 'Buena razón' : 'Esa razón no es la mejor'}</p>
          ${pq.ok ? '' : `<p><strong>La mejor razón:</strong> ${correcto.t}</p>`}
          <p style="font-size:1.08rem">${m.explica} ${escuchar(m.explica)}</p>
          <p class="ley">${ic('book-open')} Lo dice: ${m.norma}</p>
        </div>
        <div class="derecha"><button class="btn btn-cancha" data-accion="siguiente-mito">${ultimo ? 'Ver mi lámina' : 'Siguiente'} ${ic('arrow-right')}</button></div>`;
      }
    }
    return `<div class="app">${barra('Mito o verdad', 'vestuario')}
      <div class="pips" aria-hidden="true">${MITOS.map((_, k) => `<span class="${k < n.mi ? 'ok' : k === n.mi ? 'ahora' : ''}"></span>`).join('')}</div>
      <div class="pila">
        <div class="afirmacion">${ic('quote', 'comillas')}<p>${m.texto}</p>${escuchar(m.texto, true, 'claro')}</div>
        <p class="etiqueta" style="align-self:flex-start">Frase ${n.mi + 1} de ${MITOS.length}</p>
        ${cuerpo}
      </div>
    </div>`;
  },

  'n1-cierre'(){
    const n = state.n1;
    return `<div class="app">${barra('¡Nivel 1 completo!', 'vestuario')}
      <div class="pila">
        <div class="cierre">
          <div class="lamina${n.laminaVista ? ' quieta' : ''}" role="img" aria-label="Lámina 1: Escáner de derechos">
            <span class="numl">LÁMINA 01</span>
            <span class="icono-l">${ic('scan-line')}</span>
            <h3>Escáner de derechos</h3>
            <p>Reconozco mis derechos y los de los demás.</p>
          </div>
          <div class="pila">
            <p style="font-size:1.15rem">Ganaste tu primera lámina. Quedó pegada en tu álbum del vestuario.</p>
            <div class="datos">
              <div class="dato"><b>${SITUACIONES.length}</b><span>situaciones escaneadas</span></div>
              <div class="dato"><b>${n.aciertos}</b><span>reconocidas a la primera</span></div>
              <div class="dato"><b>${n.mitosOk} de ${MITOS.length}</b><span>mitos y verdades (${n.porqueOk} con la mejor razón)</span></div>
            </div>
          </div>
        </div>
        <section class="tarjeta pila" style="gap:12px">
          <h3 style="font-size:1.25rem">¿Cómo te fue reconociendo derechos?</h3>
          <div class="autoeval">${Object.entries(AUTOEVAL).map(([k, v]) => `<button data-accion="autoeval" data-valor="${k}" aria-pressed="${n.autoeval === k}">${v.txt}</button>`).join('')}</div>
          ${n.autoeval ? `<p role="status" class="entra">${AUTOEVAL[n.autoeval].msg}</p>` : ''}
        </section>
        <div class="cuaderno">${ic('notebook-pen')}<p><strong>Para tu cuaderno:</strong> escribe un derecho que viste hoy, una situación en la que estaba en riesgo y una acción para cuidarlo en tu salón.</p></div>
        <div class="fila">
          <button class="btn btn-cancha" data-accion="ir" data-valor="vestuario">${ic('house')} Volver al vestuario</button>
          <button class="btn" data-accion="empezar-n1">${ic('rotate-ccw')} Jugar de nuevo</button>
        </div>
      </div>
    </div>`;
  },

  'docente-clave'(){
    return `<div class="app">${barra('Panel docente', 'inicio')}
      <form class="tarjeta pila clave" id="form-clave" novalidate>
        <p class="fila" style="gap:8px;font-weight:700">${ic('lock')} Esta sección es para docentes.</p>
        <label for="clave">Escribe la clave</label>
        <input class="campo-texto" id="clave" type="password" inputmode="numeric" autocomplete="off">
        <p class="error" id="error-clave" role="alert">${state.errorClave}</p>
        <p style="font-size:.88rem;color:var(--tinta-2)">Pista: es el número de la ley del Código de la Infancia y la Adolescencia.</p>
        <div><button class="btn btn-cancha" type="submit">${ic('key-round')} Entrar</button></div>
      </form>
    </div>`;
  }

};

const acciones = {
  ir(v){ state.errorClave = ''; state.screen = (v === 'docente-clave' && state.docenteOk) ? 'docente' : v; },
  jugar(){ state.screen = state.avatarListo ? 'vestuario' : 'avatar'; },
  proyector(){ state.proyector = !state.proyector; guardar(); },
  avatar(v){ const [campo, i] = v.split(':'); state.avatar[campo] = Number(i); guardar(); },
  numero(v){ let x = state.avatar.numero + Number(v); if (x < 1) x = 99; if (x > 99) x = 1; state.avatar.numero = x; guardar(); },
  'avatar-listo'(){ state.avatarListo = true; guardar(); state.screen = 'vestuario'; },
  'empezar-n1'(){ state.n1 = nuevoN1(); state.screen = 'n1-escaner'; },
  estado(v){
    const n = state.n1, s = S[n.orden[n.i]];
    if (n.fase !== 'estado') return;
    if (v === s.estado) { n.okEstado = n.intentosEstado === 0; n.fase = 'derecho'; n.pista = ''; n.sacudir = ''; }
    else { n.intentosEstado++; n.pista = v === 'cuidado' ? PISTA_A_RIESGO : PISTA_A_CUIDADO; n.sacudir = 'estado'; }
  },
  accion1(v){
    const n = state.n1, s = S[n.orden[n.i]], k = Number(v);
    if (!s.acciones || n.fase !== 'feedback' || n.accionOk) return;
    if (!n.accVistas.includes(k)) n.accVistas.push(k);
    if (s.acciones[k].ok) { n.accionOk = true; if (n.accVistas.length === 1) n.accionesOk++; registrar('n1a:' + s.id, n.accVistas.length === 1); }
  },
  porque1(v){
    const n = state.n1, m = MITOS[n.mi];
    if (!n.respMito || n.porqueResp !== null) return;
    n.porqueResp = Number(v);
    if (m.porque[n.porqueResp].ok) n.porqueOk++;
  },
  derecho(v){
    const n = state.n1, s = S[n.orden[n.i]];
    if (n.fase !== 'derecho') return;
    if (v === s.derecho || s.tambien.includes(v)) {
      n.elegido = v; n.okDerecho = n.intentosDerecho === 0; n.fase = 'feedback'; n.pista = ''; n.sacudir = '';
      if (n.okEstado && n.okDerecho) n.aciertos++;
      n.ordenAcc = s.acciones ? mezclar(s.acciones.map((_, k) => k)) : null;
      registrar('n1:' + s.id, n.okEstado && n.okDerecho);
    } else {
      n.intentosDerecho++;
      if (!n.descartados.includes(v)) n.descartados.push(v);
      if (n.intentosDerecho >= 2) { n.elegido = s.derecho; n.okDerecho = false; n.revelado = true; n.fase = 'feedback'; n.pista = ''; n.sacudir = ''; n.ordenAcc = s.acciones ? mezclar(s.acciones.map((_, k) => k)) : null; registrar('n1:' + s.id, false); }
      else { n.pista = 'Ese derecho también es importante, pero aquí hay otro que está más en juego. Pista: ' + s.pista; n.sacudir = 'derecho'; }
    }
  },
  siguiente(){
    const n = state.n1;
    if (n.i >= n.orden.length - 1) { state.screen = 'n1-mitos'; return; }
    Object.assign(n, {i:n.i + 1, fase:'estado', intentosEstado:0, intentosDerecho:0, okEstado:false, okDerecho:false, elegido:null, revelado:false, descartados:[], pista:'', sacudir:'', accVistas:[], accionOk:false, ordenAcc:null});
  },
  mito(v){ const n = state.n1; if (n.respMito) return; n.respMito = v; n.porqueResp = null; n.ordenPorque = mezclar(MITOS[n.mi].porque.map((_, k) => k)); if (v === MITOS[n.mi].resp) n.mitosOk++; registrar('n1m:' + n.mi, v === MITOS[n.mi].resp); },
  'siguiente-mito'(){
    const n = state.n1;
    if (n.mi >= MITOS.length - 1) { state.progreso.n1 = true; guardar(); contarPartida('n1'); state.screen = 'n1-cierre'; return; }
    n.mi++; n.respMito = null; n.porqueResp = null;
  },
  autoeval(v){ state.n1.autoeval = v; }
};

let pantallaPrevia = null;
function render(){
  document.documentElement.classList.toggle('proyector', state.proyector);
  const html = (pantallas[state.screen] || pantallas.inicio)();
  document.getElementById('raiz').innerHTML = html;
  if (pantallaPrevia !== state.screen) {
    detenerVoz();
    window.scrollTo(0, 0);
    const t = document.getElementById('titulo-pantalla');
    if (t && pantallaPrevia !== null) t.focus({preventScroll:true});
    pantallaPrevia = state.screen;
  }
  if (state.n1) { state.n1.sacudir = ''; if (state.screen === 'n1-cierre') state.n1.laminaVista = true; }
  if (state.n2) { state.n2.sacudir = ''; if (state.screen === 'n2-cierre') state.n2.laminaVista = true; }
  if (state.n3 && state.screen === 'n3-cierre') state.n3.laminaVista = true;
  if (state.n4) { state.n4.sacudir = ''; if (state.screen === 'n4-cierre') state.n4.laminaVista = true; }
  document.querySelectorAll('[data-anima]').forEach(el => {
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.width = el.dataset.anima + '%'; }));
  });
  if (state.desplazar) {
    const d = document.getElementById(state.desplazar);
    state.desplazar = null;
    if (d) d.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest'});
  }
}

function ejecutar(b, e){
  const f = acciones[b.dataset.accion];
  if (!f) return;
  const antes = state.screen;
  f(b.dataset.valor);
  render();
  if (antes === state.screen && e.detail === 0) {
    const sel = '[data-accion="' + b.dataset.accion + '"]' + (b.dataset.valor ? '[data-valor="' + b.dataset.valor + '"]' : '');
    const nb = document.querySelector(sel) || document.querySelector('#raiz button');
    if (nb) nb.focus();
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-accion]');
  if (b) ejecutar(b, e);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const b = e.target.closest && e.target.closest('[data-accion]');
  if (!b || b.tagName === 'BUTTON') return;
  e.preventDefault();
  ejecutar(b, {detail: 0});
});
document.addEventListener('input', e => {
  if (e.target.id === 'propio-texto' && state.n4) { state.n4.borrador = e.target.value.slice(0, 120); return; }
  if (e.target.id === 'curso' && state.n4) { state.n4.curso = e.target.value.slice(0, 20); return; }
  if (e.target.id === 'apodo') {
    state.avatar.apodo = e.target.value.slice(0, 14);
    const v = document.getElementById('nombre-vista');
    if (v) v.textContent = state.avatar.apodo || 'Tu jugador';
    guardar();
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'form-clave') return;
  e.preventDefault();
  const val = (document.getElementById('clave').value || '').trim();
  if (val === CLAVE) { state.errorClave = ''; state.docenteOk = true; state.screen = 'docente'; }
  else { state.errorClave = val ? 'Clave incorrecta. Revisa la pista.' : 'Escribe la clave para entrar.'; }
  render();
  if (state.screen === 'docente-clave') { const c = document.getElementById('clave'); if (c) c.focus(); }
});

function start(data){
  try {
    const g = JSON.parse(localStorage.getItem('juego-limpio') || 'null');
    if (g) {
      if (g.avatar) Object.assign(state.avatar, g.avatar);
      if (g.progreso) state.progreso = g.progreso;
      state.proyector = !!g.proyector; state.avatarListo = !!g.avatarListo;
      if (g.caso) state.caso = Object.assign({inicial:null, final:null}, g.caso);
    }
  } catch(e) {}
  if (data && data.screen) state = Object.assign(state, data);
  render();
}
window.claude?.hot?.snapshot?.(() => state);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
